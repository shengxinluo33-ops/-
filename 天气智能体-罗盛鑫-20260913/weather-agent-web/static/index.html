<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天气 Agent · 工具调用演示</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e3e6ea;
    --text: #1f2328;
    --muted: #6b7280;
    --user: #2563eb;
    --tool: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 0; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 0 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { font-size: 12px; color: var(--muted); margin-left: auto; text-align: right; line-height: 1.4; }
  header button {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: #c9ced5; }

  #log { flex: 1; overflow-y: auto; padding: 20px 0; }

  .msg { margin-bottom: 22px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bubble {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user); border-color: var(--user); color: #fff; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .who { align-self: flex-end; }
  .bubble .caret { display: inline-block; width: 7px; background: var(--muted); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .steps { margin-bottom: 10px; }
  .step {
    font-size: 12.5px; background: var(--tool); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; margin-bottom: 5px; color: #444;
  }
  .step .k { color: var(--muted); }
  .step code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #e8eaed; padding: 1px 5px; border-radius: 4px; font-size: 12px;
  }
  .step.result code { background: transparent; padding: 0; }
  .step.pending { color: var(--muted); font-style: italic; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 10px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .chip:hover { color: var(--user); border-color: var(--user); }

  form { display: flex; gap: 10px; padding: 12px 0 20px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; resize: none; height: 52px; padding: 12px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; outline: none; background: var(--card);
  }
  textarea:focus { border-color: var(--user); }
  button.send {
    width: 84px; border: none; border-radius: 10px; background: var(--user);
    color: #fff; font-size: 14px; cursor: pointer;
  }
  button.send:disabled { background: #c7d2fe; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>天气 Agent</h1>
    <span class="meta" id="meta">加载中…</span>
    <button id="reset">清空会话</button>
  </header>

  <div id="log"></div>

  <div class="chips">
    <span class="chip">昆明现在天气怎么样？</span>
    <span class="chip">我在昆明，今天适合去哪玩？</span>
    <span class="chip">北京和广州今天哪里更暖和？</span>
    <span class="chip">下雪的话哈尔滨穿什么？</span>
  </div>

  <form id="form">
    <textarea id="input" placeholder="问点什么…  Enter 发送，Shift+Enter 换行"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const SESSION = 's-' + Math.random().toString(36).slice(2);

fetch('/api/info').then(r => r.json()).then(d => {
  document.getElementById('meta').innerHTML =
    `模型 <b>${d.model}</b><br>工具 ${d.tools.join(' / ')}${d.tavily ? '' : '（景点为内置兜底）'}`;
});

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  input.value = c.textContent; input.focus();
});
document.getElementById('reset').onclick = async () => {
  await fetch('/api/reset', {method: 'POST', headers: {'Content-Type': 'application/json'},
                             body: JSON.stringify({session_id: SESSION})});
  log.innerHTML = '';
};

function scroll() { log.scrollTop = log.scrollHeight; }

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="who">你</div><div class="bubble"></div>`;
  d.querySelector('.bubble').textContent = text;
  log.appendChild(d); scroll();
}

function addAssistant() {
  const d = document.createElement('div');
  d.className = 'msg agent';
  d.innerHTML = `<div class="who">Agent</div><div class="steps"></div><div class="bubble"><span class="caret">&nbsp;</span></div>`;
  log.appendChild(d); scroll();
  return {
    steps: d.querySelector('.steps'),
    bubble: d.querySelector('.bubble'),
    caret: d.querySelector('.caret'),
    text: ''
  };
}

function step(el, html, cls = '') {
  const s = document.createElement('div');
  s.className = 'step ' + cls;
  s.innerHTML = html;
  el.appendChild(s); scroll();
  return s;
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

const form = document.getElementById('form');
form.onsubmit = async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  sendBtn.disabled = true;

  addUser(text);
  const ui = addAssistant();

  const argsStr = a => Object.entries(a).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: SESSION, message: text})
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === '__end__') continue;

        if (ev.type === 'status') {
          const s = step(ui.steps, `<span class="k">${ev.data}</span>`, 'pending');
          ui._pending = s;
        } else if (ev.type === 'tool_call') {
          if (ui._pending) { ui._pending.remove(); ui._pending = null; }
          step(ui.steps, `⚙ 调用 <code>${ev.data.name}(${argsStr(ev.data.args)})</code>`);
        } else if (ev.type === 'tool_result') {
          step(ui.steps, `<span class="k">←</span> <code>${ev.data.result}</code>`, 'result');
        } else if (ev.type === 'token') {
          if (ui._pending) { ui._pending.remove(); ui._pending = null; }
          ui.text += ev.data;
          ui.bubble.textContent = ui.text;
          ui.bubble.appendChild(ui.caret);
          scroll();
        } else if (ev.type === 'error') {
          step(ui.steps, `⚠ ${ev.data}`, 'pending');
        } else if (ev.type === 'done') {
          ui.caret.remove();
          if (!ui.text) ui.bubble.textContent = '（没有生成内容）';
        }
      }
    }
    if (ui.caret.parentNode) ui.caret.remove();
  } catch (err) {
    step(ui.steps, `⚠ 请求失败：${err.message}`, 'pending');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
};
input.focus();
</script>
</body>
</html>
